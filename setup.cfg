[metadata]
name = spindle-dev
version = 0.1.0
description = Spindle and Spindle-lite: search over spatial-omics tile covariances.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = sarkar_lab

[options]
package_dir =
    = src
packages = find:
install_requires =
    numpy
    scipy
    scikit-learn
    umap-learn
    scanpy
    joblib
    igraph
    leidenalg
python_requires = >=3.9

[options.packages.find]
where = src
