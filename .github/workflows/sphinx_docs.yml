name: Build and deploy Sphinx docs

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build Sphinx HTML
        run: |
          sphinx-build -b html docs_src docs/_build/html -a

      - name: Copy examples
        run: |
          # Copy any prebuilt examples folder (keeps existing behaviour)
          if [ -d docs/examples ]; then
            cp -r docs/examples docs/_build/html/
          fi

      - name: Ensure examples directory index
        run: |
          # Create examples/index.html that redirects to examples.html so /examples/ works
          if [ -f docs/_build/html/examples.html ]; then
            mkdir -p docs/_build/html/examples
            printf '%s
'<!doctype html>' '%s
'<html>' '%s
'  <head>' '%s
'    <meta http-equiv="refresh" content="0; url=../examples.html">' '%s
'    <meta name="robots" content="noindex">' '%s
'    <link rel="canonical" href="../examples.html">' '%s
'    <title>Examples — redirect</title>' '%s
'  </head>' '%s
'  <body>' '%s
'    <p>Redirecting to <a href="../examples.html">examples.html</a>.</p>' '%s
'  </body>' '%s
'</html>' > docs/_build/html/examples/index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: ''
          keep_files: true
