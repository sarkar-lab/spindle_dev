name: Build notebooks and deploy to docs/

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert nbformat markdown
      - name: Build notebooks into docs/
        run: |
          python scripts/build_notebooks.py
      - name: Commit built docs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "ci: build docs (notebooks -> html)"
          file_pattern: docs/**
          branch: main
