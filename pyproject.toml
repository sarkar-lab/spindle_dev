[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-dev"
version = "0.1.0"
description = "Indexing and searching SPD sub-matrices from spatial datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "umap-learn",
  "scanpy"
]
