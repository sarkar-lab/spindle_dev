[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-dev"
version = "0.1.0"
description = "Spindle and Spindle-lite: search over spatial-omics tile covariances."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "umap-learn",
  "scanpy",
  "joblib",
  "igraph",
  "leidenalg",
]
